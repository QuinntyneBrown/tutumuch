<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TuTuMuch business card</title>
    <!--
      Standard North American card: 3.5 x 2 in trim, 0.125 in bleed on every side
      (3.75 x 2.25 in). CSS px at 96/in: 360 x 216 with bleed, trim inset 12px,
      safe area a further 12px in. render.mjs captures at deviceScaleFactor 3.125
      for 300 DPI and prints both sides to a two-page PDF.
      ?side=front | back | both, and &guides=1 draws the trim (solid) and safe (dashed) lines.
    -->
    <link rel="stylesheet" href="../print.css" />
    <style>
      @page { size: 3.75in 2.25in; margin: 0; }
      html, body { background: #ffffff; }
      .card { position: relative; width: 360px; height: 216px; overflow: hidden; break-after: page; }
      .card > * { position: absolute; }

      /* Front: cream stock, Tilly waving from the stack of folded clothes. */
      .front { background: var(--cream); }
      .front__band { left: 0; right: 0; bottom: 0; height: 30px; background: var(--raspberry); }
      .front__dots { left: 0; right: 0; bottom: 30px; height: 7px; background: var(--blush); }
      .front__wordmark { left: 28px; top: 28px; width: 150px; }
      .front__name { left: 32px; top: 86px; margin: 0; font: 900 19px/1.1 var(--font-body); letter-spacing: -0.01em; }
      .front__role { left: 32px; top: 109px; margin: 0; font: 600 10px/1.3 var(--font-body); color: var(--muted); }
      .front__contact { left: 32px; top: 132px; margin: 0; padding: 0; list-style: none; font: 800 10px/1.6 var(--font-body); color: var(--raspberry-700); }
      .front__contact svg { width: 9px; height: 9px; vertical-align: -1px; margin-right: 5px; }
      .front__circle { right: 20px; top: 32px; width: 132px; height: 132px; border-radius: 50%; }
      .front__tilly { right: 34px; bottom: 26px; height: 166px; }

      /* Back: raspberry flood, the wordmark with its reversed ink shadow. */
      .back { background-color: var(--raspberry); background-image: radial-gradient(#e0548a 18%, transparent 20%); background-size: 22px 22px; }
      .back__panel { left: 50%; top: 50%; width: 270px; height: 136px; transform: translate(-50%, -50%); border-radius: 24px; background: var(--raspberry); }
      .back__wordmark { left: 50%; top: 52px; width: 236px; transform: translateX(-50%); }
      .back__tag { left: 0; right: 0; top: 122px; text-align: center; font-size: 17px; color: var(--white); }
      .back__tag em { font-style: normal; color: var(--sunny); }
      .back__url { left: 0; right: 0; bottom: 24px; text-align: center; font: 800 9px/1 var(--font-body); letter-spacing: 0.14em; color: var(--blush); }

      .guides .card::before, .guides .card::after { content: ""; position: absolute; pointer-events: none; z-index: 10; }
      .guides .card::before { inset: 12px; outline: 0.75px solid #ff00ff; }
      .guides .card::after { inset: 24px; outline: 0.75px dashed #00b3ff; }
    </style>
  </head>
  <body>
    <section class="card front" aria-label="Front">
      <div class="front__dots dots" style="background-color: var(--blush); background-image: radial-gradient(var(--dot) 30%, transparent 34%); background-size: 7px 7px"></div>
      <div class="front__band"></div>
      <div class="front__circle gingham" style="background-size: 16px 16px"></div>
      <img class="char front__tilly" src="../../characters/tilly-hello.png" alt="" />
      <span class="front__wordmark" data-wordmark></span>
      <p class="front__name">Quinntyne Brown</p>
      <p class="front__role">Founder, TuTuMuch</p>
      <ul class="front__contact">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>hello@tutumuch.kids</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>www.tutumuch.kids</li>
      </ul>
    </section>

    <section class="card back" aria-label="Back">
      <div class="back__panel"></div>
      <span class="back__wordmark" data-wordmark data-shadow="#3A2233"></span>
      <div class="back__tag display">Twirl it <em>forward.</em></div>
      <div class="back__url">WWW.TUTUMUCH.KIDS</div>
    </section>

    <script>
      const params = new URLSearchParams(location.search)
      const side = params.get('side') || 'both'
      if (params.get('guides')) document.body.classList.add('guides')
      for (const card of document.querySelectorAll('.card')) {
        if (side !== 'both' && !card.classList.contains(side)) card.remove()
      }
    </script>
    <script src="../wordmark.js"></script>
  </body>
</html>
