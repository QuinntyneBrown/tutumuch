@if (toBuy()) {
  <div>
    <h1>Sign in to buy</h1>
    <p class="text-muted sign-in__lead">You’ll go straight back to the item.</p>
  </div>
} @else {
  <div><h1>Sign in</h1></div>
}
@if (failure(); as failure) {
  @if (failure.kind === 'incorrect') {
    <tl-alert tone="danger" heading="Email or password is incorrect">Check both and try again.</tl-alert>
  } @else {
    <tl-alert tone="danger" heading="Something went wrong"
      >Try again in a moment. <span class="ref">{{ failure.ref }}</span></tl-alert
    >
  }
}
<form class="stack stack--lg" novalidate [formGroup]="form" (ngSubmit)="submit()">
  <tl-form-field fieldId="email" label="Email">
    <input class="input" id="email" type="email" autocomplete="email" formControlName="email" [readonly]="busy()" />
  </tl-form-field>
  <div class="stack stack--sm">
    <tl-form-field fieldId="password" label="Password">
      <input
        class="input"
        id="password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [readonly]="busy()"
      />
    </tl-form-field>
  </div>
  <div class="stack">
    <button tlButton="primary" size="lg" [block]="true" type="submit" [busy]="busy()">Sign in</button>
  </div>
</form>
<p class="text-sm text-muted">New to TuTuMuch? <a routerLink="/join">Join</a></p>
