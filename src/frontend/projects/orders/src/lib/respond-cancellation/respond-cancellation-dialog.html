<tm-dialog [heading]="data.buyerDisplayName + ' asked to cancel'">
  <span description
    >Accepting refunds {{ money(data.total) }} in full. Declining keeps the order — you still ship by
    {{ day(data.shipBy) }}.</span
  >
  @if (state() === 'failed') {
    <tm-alert top tone="danger" heading="That didn’t go through"
      >Nothing changed. Check your connection and try again.</tm-alert
    >
  }
  @if (data.message) {
    <tm-quote [text]="data.message" [cite]="data.buyerDisplayName" />
  }
  <ng-container ngProjectAs="[footer]">
    <button
      tmButton
      type="button"
      [disabled]="pending() === 'Accept'"
      [busy]="pending() === 'Decline'"
      (click)="respond('Decline')"
    >
      Decline
    </button>
    <button
      tmButton="primary"
      type="button"
      data-autofocus
      [disabled]="pending() === 'Decline'"
      [busy]="pending() === 'Accept'"
      (click)="respond('Accept')"
    >
      Accept and refund
    </button>
  </ng-container>
</tm-dialog>
