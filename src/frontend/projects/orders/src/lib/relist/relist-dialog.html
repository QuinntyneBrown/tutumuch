<tl-dialog heading="Relist this item?" size="sm">
  <span description>It goes back in the catalog with its original photos, price and description.</span>
  @if (state() === 'failed') {
    <tl-alert top tone="danger" heading="That didn’t go through"
      >Nothing changed. Check your connection and try again.</tl-alert
    >
  }
  <tl-item-row [title]="data.item.title" [meta]="meta">
    <div thumb class="thumb">
      <div class="photo photo--6">
        @if (data.item.photo; as photo) {
          <picture>
            <source type="image/webp" [attr.srcset]="photo.webp" sizes="64px" />
            <img [src]="photo.src" [attr.srcset]="photo.jpeg" sizes="64px" alt="" width="160" height="160" />
          </picture>
        }
      </div>
    </div>
  </tl-item-row>
  <ng-container ngProjectAs="[footer]">
    <button tlButton type="button" [disabled]="state() === 'busy'" (click)="ref.close()">Not now</button>
    <a tlButton [routerLink]="['/items', data.item.reference, 'edit']" (click)="ref.close()">Edit first</a>
    <button tlButton="primary" type="button" data-autofocus [busy]="state() === 'busy'" (click)="submit()">
      {{ state() === 'failed' ? 'Try again' : 'Relist' }}
    </button>
  </ng-container>
</tl-dialog>
