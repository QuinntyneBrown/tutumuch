<tl-dialog heading="Cookie settings" size="sm">
  <tl-switch label="Strictly necessary" hint="Sign-in and checkout. Always on." [checked]="true" disabled />
  <tl-switch label="Analytics" hint="Helps us see which pages are slow." [(checked)]="analytics" autofocus />
  <ng-container ngProjectAs="[footer]">
    <button tlButton type="button" (click)="ref.close()">Cancel</button>
    <button tlButton="primary" type="button" (click)="save()">Save</button>
  </ng-container>
</tl-dialog>
