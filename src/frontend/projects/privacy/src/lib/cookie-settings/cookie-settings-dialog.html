<tm-dialog heading="Cookie settings" size="sm">
  <tm-switch label="Strictly necessary" hint="Sign-in and checkout. Always on." [checked]="true" disabled />
  <tm-switch label="Analytics" hint="Helps us see which pages are slow." [(checked)]="analytics" autofocus />
  <ng-container ngProjectAs="[footer]">
    <button tmButton type="button" (click)="ref.close()">Cancel</button>
    <button tmButton="primary" type="button" (click)="save()">Save</button>
  </ng-container>
</tm-dialog>
