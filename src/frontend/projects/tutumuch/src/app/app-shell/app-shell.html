@if (shell() === 'auth') {
  <div class="auth-layout">
    <tl-logo size="lg" />
    <main id="main" class="auth-card" tabindex="-1">
      <router-outlet />
    </main>
  </div>
} @else if (shell() === 'admin') {
  <tl-top-bar variant="admin" [member]="auth.member()" />
  <main id="main" class="container page" tabindex="-1">
    <router-outlet />
  </main>
} @else {
  <tl-payout-banner />
  <tl-top-bar [member]="auth.member()" [query]="query()" (searched)="search($event)" />
  <main id="main" [class]="shell() === 'marketing' ? 'marketing' : 'container page'" tabindex="-1">
    <router-outlet />
  </main>
  <tl-footer (cookieSettings)="cookieSettings.open()" />
}
