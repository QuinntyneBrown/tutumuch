<svg
  class="icon"
  [class.icon--sm]="size() === 'sm'"
  [class.icon--lg]="size() === 'lg'"
  viewBox="0 0 24 24"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('menu') {
      <svg:path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('close') {
      <svg:path d="M6 6l12 12M18 6 6 18" />
    }
    @case ('plus') {
      <svg:path d="M12 5v14M5 12h14" />
    }
    @case ('check') {
      <svg:path d="M5 12l5 5L20 7" />
    }
    @case ('check-circle') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="m8 12 3 3 5-6" />
    }
    @case ('info') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="M12 11v5M12 8h.01" />
    }
    @case ('alert') {
      <svg:path d="M12 3 2 20h20zM12 10v4M12 17h.01" />
    }
    @case ('x-circle') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="m9 9 6 6M15 9l-6 6" />
    }
    @case ('lock') {
      <svg:rect x="5" y="11" width="14" height="10" />
      <svg:path d="M8 11V7a4 4 0 0 1 8 0v4" />
    }
    @case ('mail') {
      <svg:rect x="3" y="5" width="18" height="14" />
      <svg:path d="m3 7 9 6 9-6" />
    }
    @case ('refresh') {
      <svg:path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
    }
    @case ('clock') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="M12 7v5l3 2" />
    }
    @case ('camera') {
      <svg:path d="M4 8h3l2-3h6l2 3h3v11H4z" />
      <svg:circle cx="12" cy="13" r="3.5" />
    }
    @case ('image') {
      <svg:rect x="3" y="4" width="18" height="16" />
      <svg:circle cx="9" cy="10" r="2" />
      <svg:path d="m21 17-5-5-9 8" />
    }
    @case ('trash') {
      <svg:path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
    }
    @case ('tag') {
      <svg:path d="M3 12V4h8l10 10-8 8z" />
      <svg:circle cx="7.5" cy="8.5" r="1.5" />
    }
    @case ('wifi-off') {
      <svg:path
        d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5-2.7M14 10.3A10 10 0 0 1 19 13M2 9.5a15 15 0 0 1 4.5-2.8M10.5 6.1A15 15 0 0 1 22 9.5M12 20h.01"
      />
    }
    @case ('edit') {
      <svg:path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" />
    }
    @case ('star') {
      <svg:path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z" />
    }
    @case ('map-pin') {
      <svg:path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z" />
      <svg:circle cx="12" cy="9" r="2.5" />
    }
    @case ('truck') {
      <svg:path d="M3 6h11v10H3zM14 10h4l3 3v3h-7" />
    }
    @case ('external') {
      <svg:path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" />
    }
    @case ('search') {
      <svg:circle cx="11" cy="11" r="7" />
      <svg:path d="m20 20-3.5-3.5" />
    }
    @case ('flag') {
      <svg:path d="M5 21V4h11l-2 4 2 4H5" />
    }
    @case ('bag') {
      <svg:path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2" />
    }
    @case ('eye-off') {
      <svg:path
        d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.5M6.6 6.6A17 17 0 0 0 3 12s4 6 9 6a9 9 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"
      />
    }
  }
</svg>
