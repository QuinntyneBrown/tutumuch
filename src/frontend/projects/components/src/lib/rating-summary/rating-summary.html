@if (rating().count > 0 && rating().average !== null) {
  <span class="rating" role="img" [attr.aria-label]="label()">
    <span class="rating__stars">
      @for (star of stars; track star) {
        <tl-icon name="star" [class.icon--off]="star > (rating().average ?? 0) + 0.5" />
      }
    </span>
    <span class="rating__value">{{ rating().average | number: '1.1-1' }}</span>
    <span class="text-muted">({{ rating().count | number }} {{ reviews() }})</span>
  </span>
} @else {
  <span class="text-muted">No reviews yet</span>
}
