<a
  class="logo"
  [class.logo--sm]="size() === 'sm'"
  [class.logo--lg]="size() === 'lg'"
  [class.logo--reversed]="tone() === 'reversed'"
  [class.logo--responsive]="responsive()"
  routerLink="/"
  aria-label="TuTuMuch home"
>
  <span class="wordmark" aria-hidden="true">
    <span class="wordmark__row wordmark__row--shadow">
      @for (letter of letters; track $index) {
        <span class="wordmark__letter" [style.transform]="transform(letter)">{{ letter.ch }}</span>
      }
    </span>
    <span class="wordmark__row wordmark__row--face">
      @for (letter of letters; track $index) {
        <span class="wordmark__letter wordmark__letter--{{ letter.fill }}" [style.transform]="transform(letter)">{{
          letter.ch
        }}</span>
      }
    </span>
  </span>
  @if (responsive()) {
    <tl-mark class="logo__mark" [size]="44" />
  }
</a>
