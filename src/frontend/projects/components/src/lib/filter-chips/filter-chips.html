<div class="cluster" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      class="chip"
      type="button"
      [attr.aria-pressed]="option.value === selected()"
      (click)="selectedChange.emit(option.value)"
    >
      {{ option.label }} <span class="num">{{ option.count }}</span>
    </button>
  }
</div>
