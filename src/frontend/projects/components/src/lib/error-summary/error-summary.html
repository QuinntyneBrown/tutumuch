@if (errors().length) {
  <div #box class="alert alert--danger form-summary" role="alert" tabindex="-1" id="error-summary">
    <tl-icon name="x-circle" />
    <div class="alert__body">
      <div class="alert__title">{{ heading() }}</div>
      <ul class="error-summary__list">
        @for (error of errors(); track error.fieldId) {
          <li>
            <a [href]="'#' + error.fieldId" (click)="jump($event, error.fieldId)">{{ error.message }}</a>
          </li>
        }
      </ul>
    </div>
  </div>
}
