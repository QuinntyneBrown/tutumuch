@if (loading()) {
  <ul class="listing-grid" role="list" aria-busy="true" aria-label="Loading listings">
    @for (i of skeletons; track i) {
      <li>
        <div class="listing-card" aria-hidden="true">
          <tl-skeleton shape="photo" />
          <div class="listing-card__meta">
            <tl-skeleton width="85%" />
            <tl-skeleton width="45%" />
            <tl-skeleton width="60%" />
            <tl-skeleton shape="title" width="30%" />
          </div>
        </div>
      </li>
    }
  </ul>
} @else {
  <ul class="listing-grid" role="list">
    @for (card of cards(); track card.href; let i = $index) {
      <li><tl-listing-card [card]="card" [priority]="i < eagerCount()" /></li>
    }
  </ul>
}
